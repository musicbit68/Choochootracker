name: Build PortMaster

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portmaster:
    name: Build ARM64 PortMaster package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install AArch64 toolchain and dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update

          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            pkg-config \
            zip \
            make

          sudo apt-get install -y \
            libsdl2-dev:arm64

      - name: Verify build tools
        run: |
          aarch64-linux-gnu-g++ --version
          aarch64-linux-gnu-strip --version
          pkg-config --version
          pkg-config --modversion sdl2

      - name: Build PortMaster package
        working-directory: tracker
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          make -j2 -f Makefile.portmaster PortMaster-deploy

      - name: Verify package
        run: |
          test -f releases/choochootracker.zip
          test -f tracker/build/choochootracker.aarch64

          echo "========================================"
          echo "PortMaster package created successfully"
          echo "========================================"
          ls -lh releases/choochootracker.zip
          ls -lh tracker/build/choochootracker.aarch64

      - name: Upload PortMaster ZIP
        uses: actions/upload-artifact@v4
        with:
          name: choochootracker-portmaster
          path: releases/choochootracker.zip
          if-no-files-found: error

      - name: Upload ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: choochootracker-aarch64
          path: tracker/build/choochootracker.aarch64
          if-no-files-found: error
