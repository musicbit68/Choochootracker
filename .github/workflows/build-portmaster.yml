name: Build PortMaster

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-portmaster:
    name: Build ARM64 PortMaster package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable ARM64 packages
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libsdl2-dev:arm64 \
            pkg-config \
            zip

      - name: Verify cross compiler and SDL2
        run: |
          aarch64-linux-gnu-g++ --version
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
            pkg-config --modversion sdl2

      - name: Build native playback tests
        working-directory: tracker
        run: |
          make -f Makefile.test build -j2
          ./build/tests/run_tests --test-suite=playback

      - name: Build PortMaster package
        working-directory: tracker
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          make -j2 -f Makefile.portmaster PortMaster-deploy
          test -f ../releases/choochootracker.zip
          test -f build/choochootracker.aarch64
          file build/choochootracker.aarch64
          unzip -l ../releases/choochootracker.zip

      - name: Upload PortMaster package
        uses: actions/upload-artifact@v4
        with:
          name: choochootracker-portmaster-arm64
          path: |
            releases/choochootracker.zip
            tracker/build/choochootracker.aarch64
          if-no-files-found: error
          retention-days: 30
